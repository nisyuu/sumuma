name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

jobs:
  django:
    name: Django (check / collectstatic / test)
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: 'False'
      ADMIN_DASHBOARD_PATH: admin/
      RECAPTCHA_PUBLIC_KEY: ci-dummy
      RECAPTCHA_PRIVATE_KEY: ci-dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13.2'
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install --no-root

      - name: Django system check
        run: poetry run python manage.py check

      - name: Collect static files
        run: poetry run python manage.py collectstatic --no-input

      - name: Run tests
        run: poetry run python manage.py test

  tailwind:
    name: Tailwind CSS build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theme/static_src
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: theme/static_src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
