[tool.poetry]
name = "sumuma"
version = "0.1.0"
description = ""
authors = ["にしゅう <37263474+nisyuu@users.noreply.github.com>"]

[tool.poetry.dependencies]
python = "3.13.2"
Django = ">=6.0.3,<6.2.0"
django-environ = ">=0.13,<0.15"
django-debug-toolbar = ">=6.3,<8.0"
django-tailwind = "^4.4.2"
djangorestframework = "^3.17.1"
drf-flex-fields = "^1.0.2"
drf-yasg = "1.21.15"
urllib3 = "2.7.0"
ruamel-yaml = "0.19.1"
wheel = ">=0.46.3,<0.49.0"
django-browser-reload = "^1.13.0"
python-dateutil = "^2.9.0"
ruamel-yaml-clib = "^0.2.15"
packaging = "^26.0"
pytz = "^2026.1"
setuptools = "^82.0.1"
django-recaptcha = "^4.0.0"
drf-api-logger = "^1.1.21"
django-cors-headers = "^4.4.0"
django-import-export = "^4.4.0"
psycopg2-binary = "^2.9.11"
dj-database-url = "^3.1.2"
whitenoise = {extras = ["brotli"], version = "^6.12.0"}
gunicorn = ">=25.3,<27.0"
uvicorn = ">=0.42,<0.53"
django-anymail = {extras = ["resend"], version = ">=14,<16"}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "coverage[toml] (>=7.13.0,<8.0.0)"
]
